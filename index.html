
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenci Not Hesaplama</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="kutu">
        <h1>🎓 Not Hesaplama</h1>
        <p>Vize ve final notlarını girerek ortalamanı hesapla.</p>

        <label for="vize">Vize Notu</label>
        <input type="number" id="vize" min="0" max="100" placeholder="Örneğin: 70">

        <label for="final">Final Notu</label>
        <input type="number" id="final" min="0" max="100" placeholder="Örneğin: 80">

        <button id="hesaplaButonu">Ortalamayı Hesapla</button>

        <div id="sonuc"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
